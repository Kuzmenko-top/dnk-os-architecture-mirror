version: "1.1.0"
updated_at: "2026-09-01"
description: "Centralized SSOT Manifest of excluded directories and certified assimilated projects for high-velocity full-depth system audits."

# 1. Runtime Environments, Virtualenvs, Caches, Agent Ephemeral State & Build Artifacts
environments_and_build:
  patterns:
    - ".venv"
    - "node_modules"
    - ".next"
    - "dist"
    - "build"
    - "target"
    - "__pycache__"
    - ".pytest_cache"
    - ".pytest-cache"
    - ".turbo"
    - ".git"
    - ".github"
    - ".od"
    - ".cache"
    - "cache"
    - "coverage"
    - ".tox"
    - "audio_cache"
    - "image_cache"
    - "terminal-sessions"
    - "checkpoints"
    - "pastes"
    - "logs"
    - ".hermes_history"
    - ".curator_backups"
    - "models_dev_cache*"
    - "provider_models_cache*"
    - "ollama_cloud_models_cache*"
    - ".ruff_cache"
    - ".mypy_cache"
    - ".ds_store"
    - ".DS_Store"
  rationale: "Ephemeral dependencies, agent runtime session logs, caches, and build outputs; audited via package/agent manifests rather than recursive file traversal."

# 2. Secret Stores, Private Keys, Auth & Ephemeral Databases
secrets_and_credentials:
  patterns:
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "*.pfx"
    - "*.p12"
    - "id_rsa*"
    - "*.token"
    - "*.db"
    - "*.sqlite"
    - "*.sqlite3"
    - "auth.json"
    - "processes.json"
    - "visual_shell_db.json"
    - "canvas_production_fallback.db"
    - "verification_evidence.db"
    - "state.db"
  rationale: "Encrypted, auth credentials, binary SQLite databases or sensitive state data guarded by Secret Scanner SSOT."

# 3. Verified Assimilated Projects (Skip Deep Traversal after Initial Certification)
assimilated_projects:
  - id: "open_design_lab"
    path: "projects/open_design_lab"
    name: "Open Design Lab (Assimilated Canvas & Rendering Subsystem)"
    upstream: "https://github.com/opendesign/open-design"
    license: "Apache-2.0"
    track: "Track 1 (Permissive)"
    audit_status: "VERIFIED_ASSIMILATED"
    certified_by: "gerych_auditor"
    audit_date: "2026-09-01"
    skip_deep_scan: true
    rationale: "Verified external assimilated application; deep tree audited and isolated. Monitored via top-level manifest."

  - id: "open_design_visual_shell"
    path: "visual_shell/open_design"
    name: "Open Design Visual Shell Reference Monorepo"
