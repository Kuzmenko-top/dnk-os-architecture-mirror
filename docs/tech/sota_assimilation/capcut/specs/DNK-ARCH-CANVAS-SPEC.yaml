schema_version: "1.0.0"
spec_id: "DNK-ARCH-CANVAS-SPEC"
title: "DNK OS Canvas Engine & Layer State Architecture"

architecture:
  core_principles:
    - "Hierarchical Scene Graph (Nodes, Groups, Multi-layer)"
    - "Deterministic Undo/Redo Event Sourcing"
    - "Hybrid Rendering (DOM/SVG preview + WebGL2/WebGPU/Wasm accelerated export)"
    - "AI Mutation Protocol (Generative in-painting, Seedream/Flux layer injection, AST synchronization)"

layer_model:
  node_types:
    - id: "image"
      properties: ["src", "transform", "filters", "mask", "ai_prompt_metadata"]
    - id: "vector"
      properties: ["svg_path", "fill", "stroke", "transforms"]
    - id: "text"
      properties: ["font_family", "size", "weight", "alignment", "effects"]
    - id: "group"
      properties: ["children_ids", "transform", "opacity", "blend_mode"]

state_management:
  target_engine: "Zustand + Immer / Signals"
  crdt_ready: true
  persistence: "IndexedDB + Cloud SSOT REST/WebSocket"
