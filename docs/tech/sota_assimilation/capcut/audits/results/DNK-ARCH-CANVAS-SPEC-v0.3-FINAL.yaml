# DNK-ARCH-CANVAS-SPEC v0.3 (FINAL)
# Фінальна специфікація на основі CAPCUT-CANVAS-AUDIT-001 + CAPCUT-WASM-AUDIT-002
# Ключові зміни: Rust/Wasm модулі, WebGL shaders, IndexedDB persistence

## 1. Rendering Stack (Фінальний)

### 1.1. Primary Renderer
```yaml
renderer:
  type: "Konva.js (v8.x+)"
  license: "MIT"
  github: "https://github.com/konvajs/konva"
  
  wasm_acceleration:
    language: "Rust"
    binding: "wasm-bindgen"
    repository: "everphoto-rust-clean (ByteDance, internal)"
    compilation: "wasm-pack build --release"
    
    modules:
      - name: "image-processing.wasm"
        purpose: "GPU-accelerated filters, resize, crop"
        exports:
          - "resize_image"
          - "apply_filter"
          - "composite_layers"
          - "chunked_upload"
      
      - name: "text-rendering.wasm"
        purpose: "Skia-based text rasterization"
        exports:
          - "layout_text"
          - "measure_glyphs"
          - "rasterize_font"
      
      - name: "crypto.wasm"
        purpose: "Asset integrity, DRM"
        exports:
          - "file_digest"  # SHA-256
          - "decrypt_data"
          - "encrypt_data"
```

### 1.2. WebGL Shader Engine (effect_c)

```yaml
webgl_shaders:
  engine: "ByteDance effect_c (WebGL2/WebGL1)"
  
  vertex_shaders:
    - name: "quad_view.vert"
      purpose: "Standard quad view [-1, 1] for UV mapping"
      code: |
        attribute vec2 a_position;
        attribute vec2 a_texCoord;
        varying vec2 v_texCoord;
        
        void main() {
            gl_Position = vec4(a_position, 0, 1);
            v_texCoord = a_texCoord;
        }
  
  fragment_shaders:
    - name: "min_max_clamp.frag"
      purpose: "Dynamic exposure/gamma limiting"
      code: |
        precision mediump float;
        uniform sampler2D u_texture;
        uniform float u_min;
        uniform float u_max;
        varying vec2 v_texCoord;
        
        void main() {
            vec4 color = texture2D(u_texture, v_texCoord);
            color.rgb = clamp(color.rgb, u_min, u_max);
            gl_FragColor = color;
        }
    
    - name: "dual_blend_composite.frag"
      purpose: "Multi-layer blending (mix/multiply)"
      code: |
        precision mediump float;
        uniform sampler2D u_base;
        uniform sampler2D u_blend;
        uniform float u_opacity;
        varying vec2 v_texCoord;
        
        void main() {
            vec4 base = texture2D(u_base, v_texCoord);
            vec4 blend = texture2D(u_blend, v_texCoord);
            
            // Multiply blend mode
            vec4 result = base * blend;
            result = mix(base, result, u_opacity);
            
            gl_FragColor = result;
        }
    
    - name: "tensor_packing.frag"
      purpose: "Neural network filter remapping"
      code: |
        precision mediump float;
        uniform sampler2D u_input;
        uniform vec2 u_uv_offset;
        varying vec2 v_texCoord;
        
        void main() {
            vec2 uv = v_texCoord + u_uv_offset;
            gl_FragColor = texture2D(u_input, uv);
        }
```

