## 2. State Management (Фінальний)

### 2.1. IndexedDB Persistence

```yaml
indexeddb:
  database: "dnk_os_canvas"
  version: 1
  
  stores:
    - name: "drafts"
      key_path: "canvas_id"
      purpose: "Auto-save canvas state"
      schema:
        canvas_id: "UUID"
        state: "CanvasState (JSON)"
        timestamp: "ISO8601"
        version: "Int32"
    
    - name: "history"
      key_path: "transaction_id"
      purpose: "Undo/Redo stack persistence"
      schema:
        transaction_id: "UUID"
        canvas_id: "UUID"
        operations: "CommandOperation[]"
        timestamp: "ISO8601"
    
    - name: "assets"
      key_path: "asset_id"
      purpose: "Uploaded images/videos cache"
      schema:
        asset_id: "UUID"
        type: "Image | Video"
        blob: "Blob"
        metadata: "AssetMetadata"
```

### 2.2. Chunked Upload (Rust/Wasm)

```yaml
chunked_upload:
  pattern: "Multipart upload (S3-style)"
  wasm_module: "image-processing.wasm"
  
  flow:
    - step: "CreateDraftPackage"
      api: "/cc/v1/workspace/create_draft_package"
      request:
        canvas_id: "UUID"
        filename: "String"
        size_bytes: "Int64"
      response:
        package_id: "UUID"
        chunk_size: "Int32 (default: 5MB)"
    
    - step: "CreatePartUpload"
      api: "/cc/v1/workspace/create_part_upload"
      request:
        package_id: "UUID"
        part_number: "Int32"
        chunk_hash: "String (SHA-256)"
      response:
        upload_url: "URL (presigned S3)"
    
    - step: "Upload Chunk"
      method: "PUT to upload_url"
      headers:
        Content-Type: "application/octet-stream"
        Content-MD5: "Base64(MD5(chunk))"
    
    - step: "CompletePartUpload"
      api: "/cc/v1/workspace/complete_part_upload"
      request:
        package_id: "UUID"
        part_number: "Int32"
        etag: "String"
    
    - step: "Finalize Package"
      api: "/cc/v1/workspace/finalize_package"
      request:
        package_id: "UUID"
        total_parts: "Int32"
      response:
        asset_url: "URL"
        asset_id: "UUID"
```

## 3. AI Integration (Фінальний)

### 3.1. Model Router + Wasm Acceleration

```yaml
ai_pipeline:
  stages:
    - name: "PromptValidation"
      wasm_module: "crypto.wasm"
      checks:
        - "Prompt hash (file_digest)"
        - "Credits validation"
    
    - name: "ModelSelection"
      routing:
        - "If layer_separation: seedream-5-pro"
        - "If background_removal: sam-v2"
        - "Else: flux-1-dev"
    
    - name: "Generation"
      async: true
      progress: "SSE | WebSocket"
    
    - name: "PostProcessing"
      wasm_accelerated:
        - "Upscale (ESRGAN Wasm)"
        - "Background removal (SAM Wasm)"
        - "Color grading (WebGL shaders)"
    
    - name: "CanvasIntegration"
      steps:
        - "Create AIImageCutOut node"
        - "Apply alpha mask"
        - "IndexedDB auto-save"
```

## 4. Undo/Redo (На основі CapCut)

### 4.1. Command Pattern + Differential Snapshots

```yaml
undo_redo:
  pattern: "Hybrid (Command Pattern + Differential Snapshots)"
  
  command_pattern:
    base_class: "Command"
    commands:
      - "CreateNodeCommand"
      - "UpdateNodeCommand"
      - "DeleteNodeCommand"
      - "MoveNodeCommand"
  
  differential_snapshots:
    purpose: "Memory optimization for large canvases"
    interval: "Every 10 transactions"
    storage: "IndexedDB (history store)"
  
  depth:
    max_transactions: 100
    max_memory_mb: 500
    auto_checkpoint: "Every 5 minutes"
  
  persistence:
    indexeddb: true
    export_format: "JSON (DNK-COMP-AI-DESIGN-DTO)"
    import_format: "JSON | CapCut HAR (migration)"
```

