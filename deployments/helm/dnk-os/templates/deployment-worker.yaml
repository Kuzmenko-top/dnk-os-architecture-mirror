apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include \"dnk-os.fullname\" . }}-worker"
  labels:
    app.kubernetes.io/name: "{{ include \"dnk-os.name\" . }}-worker"
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: dnk-platform
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include \"dnk-os.name\" . }}-worker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ include \"dnk-os.name\" . }}-worker"
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: "{{ include \"dnk-os.fullname\" . }}-config"
            - secretRef:
                name: "{{ include \"dnk-os.fullname\" . }}-secrets"
          resources:
            limits:
              cpu: "{{ .Values.worker.resources.limits.cpu }}"
              memory: "{{ .Values.worker.resources.limits.memory }}"
            requests:
              cpu: "{{ .Values.worker.resources.requests.cpu }}"
              memory: "{{ .Values.worker.resources.requests.memory }}"
