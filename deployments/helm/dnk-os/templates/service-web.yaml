apiVersion: v1
kind: Service
metadata:
  name: "{{ include \"dnk-os.fullname\" . }}-web"
  labels:
    app.kubernetes.io/name: "{{ include \"dnk-os.name\" . }}-web"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dnk-platform
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: "{{ include \"dnk-os.name\" . }}-web"
