global:
  environment: production
  domain: dnk-e.com

api:
  replicaCount: 2
  image:
    repository: ghcr.io/kuzmenko-top/dnk-os/api
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

web:
  replicaCount: 2
  image:
    repository: ghcr.io/kuzmenko-top/dnk-os/web
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 150m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

worker:
  replicaCount: 2
  image:
    repository: ghcr.io/kuzmenko-top/dnk-os/worker
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  hosts:
    - host: app.dnk-e.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: web
    - host: api.dnk-e.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls:
    - secretName: dnk-tls-secret
      hosts:
        - app.dnk-e.com
        - api.dnk-e.com

config:
  logLevel: "INFO"
  corsOrigins: "https://dnk.internal,https://app.dnk-e.com"

secrets:
  databaseUrl: "postgresql://dnk:dnk_pass@dnk-db-service:5432/dnk_os"
  redisUrl: "redis://dnk-redis-service:6379/0"
  jwtSecretKey: "change_me_in_production_secrets_vault"
