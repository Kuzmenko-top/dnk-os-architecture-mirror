agent_id: "dnk_security_guard"
name: "dnk_security_guard (Context Firewall & Security Guard)"
description: "DNK OS guardian enforcing multi-tenant isolation, secret redaction, and 2-stage destructive action verification"
version: "1.0.0"
domain: "security"
owner: "Head of Security"

capabilities:
  - "context_firewall_enforcement"
  - "secret_leak_detection"
  - "destructive_action_interception"
  - "tenant_isolation_audit"

auth:
  type: "system_worker"
  scope: "tenant"

task_contract:
  input_schema:
    type: "object"
    properties:
      task_id: {"type": "string"}
      action_type: {"type": "string"}
      payload: {"type": "object"}
    required: ["action_type"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      allowed: {"type": "boolean"}
      reason: {"type": "string"}

safety_gates:
  high_risk_actions: []
  token_budget_cap_usd: 2.00
  require_hitl: false
