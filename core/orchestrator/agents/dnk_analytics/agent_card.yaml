agent_id: "dnk_analytics"
name: "dnk_analytics (Data & Growth Intelligence)"
description: "DNK OS specialist for business telemetry, funnels, cohort analysis, ROAS calculation, and token spending metrics"
version: "1.0.0"
domain: "analytics"
owner: "Head of Growth"

capabilities:
  - "telemetry_cost_aggregation"
  - "funnel_conversion_analysis"
  - "roas_and_ltv_modeling"
  - "postgres_analytics_queries"

auth:
  type: "system_worker"
  scope: "workspace"

task_contract:
  input_schema:
    type: "object"
    properties:
      workspace_id: {"type": "string"}
      query_type: {"type": "string"}
    required: ["query_type"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      metrics: {"type": "object"}

safety_gates:
  high_risk_actions: []
  token_budget_cap_usd: 3.00
  require_hitl: false
