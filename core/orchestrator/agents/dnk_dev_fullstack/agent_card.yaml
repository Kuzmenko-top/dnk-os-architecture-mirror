agent_id: "dnk_dev_fullstack"
name: "dnk_dev_fullstack (Senior Backend Engineer)"
description: "DNK OS specialist for FastAPI routers, PostgreSQL schemas, Celery task workers, and real-time WebSocket streams"
version: "1.0.0"
domain: "backend"
owner: "Head of Engineering"

capabilities:
  - "fastapi_router_architecture"
  - "sqlalchemy_postgresql_schemas"
  - "redis_queue_management"
  - "async_websocket_streaming"

auth:
  type: "system_worker"
  scope: "workspace"

task_contract:
  input_schema:
    type: "object"
    properties:
      endpoint: {"type": "string"}
      spec: {"type": "string"}
    required: ["spec"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      router_path: {"type": "string"}

safety_gates:
  high_risk_actions: ["db_drop_table", "raw_sql_migration"]
  token_budget_cap_usd: 6.00
  require_hitl: false
