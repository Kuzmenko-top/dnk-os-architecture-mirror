agent_id: "herich_librarian"
name: "herich_librarian (Chief Knowledge Brain & SCONES Librarian)"
description: "DNK OS Master Librarian managing knowledge graphs, SCONES memory, ADR indexes, and repository catalog"
version: "1.0.0"
domain: "knowledge"
owner: "Head of Knowledge"

capabilities:
  - "knowledge_graph_curation"
  - "scones_memory_retrieval"
  - "adr_architecture_indexing"
  - "repository_assimilation_catalog"

auth:
  type: "system_worker"
  scope: "tenant"

task_contract:
  input_schema:
    type: "object"
    properties:
      query: {"type": "string"}
    required: ["query"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      knowledge_nodes: {"type": "array"}

safety_gates:
  high_risk_actions: []
  token_budget_cap_usd: 2.00
  require_hitl: false
