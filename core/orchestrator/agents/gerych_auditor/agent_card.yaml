agent_id: "gerych_auditor"
name: "Гєрич Auditor (QA & Security Engineer)"
description: "DNK OS Verification Engineer specializing in test automation, static analysis, path hygiene, and security gates"
version: "1.0.0"
domain: "quality_assurance"
owner: "Head of QA"

capabilities:
  - "pytest_regression_automation"
  - "path_hygiene_auditing"
  - "mrh_header_compliance_check"
  - "preflight_sanitization"
  - "database_migration_verification"

auth:
  type: "system_worker"
  scope: "workspace"

task_contract:
  input_schema:
    type: "object"
    properties:
      target_module:
        type: "string"
      run_full_suite:
        type: "boolean"
    required: []
  output_schema:
    type: "object"
    properties:
      status:
        type: "string"
      tests_passed:
        type: "integer"
      tests_failed:
        type: "integer"
      violations_found:
        type: "array"
      verdict:
        type: "string"

safety_gates:
  high_risk_actions: []
  token_budget_cap_usd: 3.00
  require_hitl: false
