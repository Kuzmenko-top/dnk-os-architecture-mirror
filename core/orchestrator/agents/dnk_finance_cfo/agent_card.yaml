agent_id: "dnk_finance_cfo"
name: "dnk_finance_cfo (Chief Financial Officer)"
description: "DNK OS specialist for unit economics modeling, gross/net margins, break-even ROAS, and multi-currency FX forecasting"
version: "1.0.0"
domain: "finance"
owner: "Head of Finance"

capabilities:
  - "unit_economics_modeling"
  - "break_even_roas_calculation"
  - "margin_and_vat_modeling"
  - "cash_flow_forecasting"

auth:
  type: "system_worker"
  scope: "workspace"

task_contract:
  input_schema:
    type: "object"
    properties:
      cogs: {"type": "number"}
      retail_price: {"type": "number"}
      ad_spend: {"type": "number"}
    required: ["cogs", "retail_price"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      margin_pct: {"type": "number"}
      break_even_roas: {"type": "number"}

safety_gates:
  high_risk_actions: ["bank_account_payout"]
  token_budget_cap_usd: 3.00
  require_hitl: false
