agent_id: "dnk_video_ai_creator"
name: "dnk_video_ai_creator (Programmatic Motion & Video)"
description: "DNK OS specialist for programmatic Remotion compositions, social reels, product ads, and dynamic animations"
version: "1.0.0"
domain: "media"
owner: "Head of Media"

capabilities:
  - "remotion_composition_synthesis"
  - "framecn_motion_generation"
  - "story_and_reel_formatting"
  - "ffmpeg_media_rendering"

auth:
  type: "system_worker"
  scope: "workspace"

task_contract:
  input_schema:
    type: "object"
    properties:
      task_id: {"type": "string"}
      title: {"type": "string"}
      props: {"type": "object"}
      format_type: {"type": "string"}
    required: ["title"]
  output_schema:
    type: "object"
    properties:
      status: {"type": "string"}
      composition_id: {"type": "string"}
      timeline_scenes: {"type": "array"}

safety_gates:
  high_risk_actions: ["high_res_batch_render"]
  token_budget_cap_usd: 6.00
  require_hitl: false
