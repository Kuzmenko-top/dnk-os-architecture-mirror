id: "brick_06_web_api_shell"
name: "Command Center Web UI & API Gateway Shell"
version: "1.0.0"
mrh_id: "core/bricks/brick_06_web_api_shell/brick.manifest.yaml"
category: "gateway_shell"
description: "Next.js 14 Cockpit, dynamic FastAPI router mount system, WebSocket bridge, session auth, and security middleware."

paths:
  - "apps/web"
  - "apps/api"
  - "config"

dependencies:
  internal:
    - "brick_01_agentic_brain"
    - "brick_02_scones_memory"
  external:
    python:
      - "fastapi>=0.110.0"
      - "uvicorn>=0.28.0"
      - "pydantic>=2.7.0"
    npm:
      - "next>=14.0.0"
      - "react>=18.0.0"
      - "lucide-react"

contracts:
  python_schema: "core/bricks/brick_06_web_api_shell/contracts/schemas.py"
  typescript_types: "core/bricks/brick_06_web_api_shell/contracts/types.ts"

entrypoints:
  web_app: "apps/web"
  api_server: "apps.api.main:app"

quality_gate:
  test_suite: "tests/api/test_api_gateway.py"
  min_coverage: 90
