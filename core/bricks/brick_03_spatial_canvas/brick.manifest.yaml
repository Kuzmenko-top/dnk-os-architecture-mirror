id: "brick_03_spatial_canvas"
name: "Spatial Canvas V3 Engine"
version: "1.0.0"
mrh_id: "core/bricks/brick_03_spatial_canvas/brick.manifest.yaml"
category: "spatial_ui"
description: "Infinite spatial graph canvas, CRDT realtime sync, node AST transformations, and multi-agent canvas projection."

paths:
  - "services/dnk_canvas_api"
  - "apps/web/app/canvas"

dependencies:
  internal:
    - "brick_02_scones_memory"
  external:
    python:
      - "fastapi>=0.110.0"
      - "pydantic>=2.7.0"
      - "websockets>=12.0"
    npm:
      - "@xyflow/react"
      - "yjs"

contracts:
  python_schema: "core/bricks/brick_03_spatial_canvas/contracts/schemas.py"
  typescript_types: "core/bricks/brick_03_spatial_canvas/contracts/types.ts"

entrypoints:
  api_router: "apps.api.routers.canvas_v3:router"
  service: "services.dnk_canvas_api.main:app"

quality_gate:
  test_suite: "tests/canvas/test_canvas_v3_phase4.py"
  min_coverage: 90
