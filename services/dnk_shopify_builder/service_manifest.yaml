service_id: "dnk_shopify_builder"
name: "Shopify Builder Microservice"
port: 8081
domain: "shopify"
status: "Active"
version: "1.0.0"
entrypoint: "services.dnk_shopify_builder.main:app"
endpoints:
  - path: "/api/v1/build"
    method: "POST"
    handler: "build_theme_section"
  - path: "/api/v1/canvas/node"
    method: "GET"
    handler: "get_canvas_node"
